name: Install Wildaina logo variants

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-branding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build transparent white and black PNG logos
        run: |
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('assets/logo.png')
          image = Image.open(source).convert('RGBA')

          # Keep the current transparent white logo if it is already transparent.
          # If any old black field remains, derive alpha from the artwork brightness.
          alpha = image.getchannel('A')
          if alpha.getextrema()[0] == 255:
              clean = Image.new('RGBA', image.size, (255, 255, 255, 0))
              src = image.load(); dst = clean.load()
              for y in range(image.height):
                  for x in range(image.width):
                      r, g, b, a = src[x, y]
                      lum = max(r, g, b)
                      dst[x, y] = (255, 255, 255, round((lum / 255) * a))
          else:
              clean = Image.new('RGBA', image.size, (255, 255, 255, 0))
              src = image.load(); dst = clean.load()
              for y in range(image.height):
                  for x in range(image.width):
                      r, g, b, a = src[x, y]
                      dst[x, y] = (255, 255, 255, a)

          bbox = clean.getbbox()
          if bbox:
              clean = clean.crop(bbox)
              pad = max(14, round(max(clean.size) * 0.03))
              padded = Image.new('RGBA', (clean.width + pad * 2, clean.height + pad * 2), (255,255,255,0))
              padded.alpha_composite(clean, (pad, pad))
              clean = padded

          white = clean
          black = Image.new('RGBA', white.size, (0,0,0,0))
          wa = white.getchannel('A')
          black.putalpha(wa)

          white.save('assets/logo-white.png', 'PNG', optimize=True)
          black.save('assets/logo-black.png', 'PNG', optimize=True)
          # Backward compatibility: keep logo.png as the white transparent version.
          white.save('assets/logo.png', 'PNG', optimize=True)
          PY

      - name: Use white logo on dark surfaces and black favicon on light browser chrome
        run: |
          python3 <<'PY'
          from pathlib import Path
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('<img src="assets/logo.png"', '<img src="assets/logo-white.png"')
              text = text.replace('<img class="admin-logo" src="assets/logo.png"', '<img class="admin-logo" src="assets/logo-white.png"')
              text = text.replace('rel="icon" type="image/png" href="assets/logo.png"', 'rel="icon" type="image/png" href="assets/logo-black.png"')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Add final logo and mobile navigation CSS
        run: |
          if ! grep -q 'WILDAINA_LOGO_VARIANTS' styles.css; then
            cat >> styles.css <<'CSS'

          /* WILDAINA_LOGO_VARIANTS */
          .brand,
          .nav .brand,
          header .brand { background: transparent !important; box-shadow: none !important; }
          .brand img,
          .nav .brand img,
          header .brand img,
          .site-footer > img {
            filter: none !important;
            mix-blend-mode: normal !important;
            background: transparent !important;
            object-fit: contain;
          }
          @media (max-width: 1000px) {
            .nav-links { display: none !important; transform: none !important; }
            .nav-links.open { display: flex !important; }
          }
          CSS
          fi

      - name: Commit branding update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Add transparent white and black logo variants'
            git push
          fi
